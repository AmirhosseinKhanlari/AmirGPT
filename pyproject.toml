[project]
name = "amirgpt"
version = "1.0.0"
description = "GPT-2 (124M) reproduced from scratch following Karpathy's 'Let's reproduce GPT-2', chat-finetuned and served as AmirGPT"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "numpy",
  "tiktoken",
  "tqdm",
  "requests",
]

[project.optional-dependencies]
data = ["datasets", "transformers"]
web = ["fastapi", "uvicorn[standard]", "sse-starlette"]
dev = ["pytest", "transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
